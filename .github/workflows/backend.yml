name: Backend checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run --prefix backend check
      - run: npm test
      - run: npm run build
      - run: npm run build:server
      - run: npx playwright install --with-deps chromium webkit
      - name: Check optional Google sign-in through the emitted server
        run: node tests/google-signin.browser.mjs
      - name: Check self-service teacher workspaces through the emitted server
        run: npm run test:teacher-self-service
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authentication-browser-failure
          retention-days: 7
          path: |
            test-results/google-signin/
            test-results/teacher-self-service/
