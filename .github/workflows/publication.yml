name: Publication checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts -p 'test_public_readiness.py'
      - run: python3 -m unittest discover -s scripts -p 'test_verify_source.py'
      - run: python3 scripts/public_readiness.py --history
