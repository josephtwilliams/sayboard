services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SAYBOARD_ORIGIN: https://${SAYBOARD_DOMAIN:?Set SAYBOARD_DOMAIN in .env}
      SAYBOARD_AUTH_ENABLED: ${SAYBOARD_AUTH_ENABLED:-0}
      SAYBOARD_TEACHER_ACCOUNT_MODE: ${SAYBOARD_TEACHER_ACCOUNT_MODE:-username}
      SAYBOARD_SIGNUP_ENABLED: ${SAYBOARD_SIGNUP_ENABLED:-0}
      SAYBOARD_PUBLIC_ACCOUNT_LIMIT: ${SAYBOARD_PUBLIC_ACCOUNT_LIMIT:-100}
      SAYBOARD_STORAGE: sqlite
      SAYBOARD_DATABASE_PATH: /data/sayboard.sqlite
      SAYBOARD_SMTP_HOST: ${SAYBOARD_SMTP_HOST:-}
      SAYBOARD_SMTP_PORT: ${SAYBOARD_SMTP_PORT:-587}
      SAYBOARD_SMTP_USER: ${SAYBOARD_SMTP_USER:-}
      SAYBOARD_SMTP_PASSWORD: ${SAYBOARD_SMTP_PASSWORD:-}
      SAYBOARD_EMAIL_FROM: ${SAYBOARD_EMAIL_FROM:-}
      SAYBOARD_EMAIL_REPLY_TO: ${SAYBOARD_EMAIL_REPLY_TO:-}
      SAYBOARD_GOOGLE_CLIENT_ID: ${SAYBOARD_GOOGLE_CLIENT_ID:-}
      SAYBOARD_GOOGLE_CLIENT_SECRET: ${SAYBOARD_GOOGLE_CLIENT_SECRET:-}
      SAYBOARD_GOOGLE_SIGNUP_ENABLED: ${SAYBOARD_GOOGLE_SIGNUP_ENABLED:-0}
    volumes:
      - boards:/data
    ports:
      - "80:80"
      - "443:443"
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get({host:'127.0.0.1',port:8080,path:'/healthz',headers:{Host:new URL(process.env.SAYBOARD_ORIGIN).host}},r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      # The proxy starts only after this passes, so probe soon after start.
      # Failures in the start period do not count, so a slow first start
      # still has at least the previous 90 seconds before turning unhealthy.
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s
  proxy:
    image: caddy:2
    network_mode: service:app
    depends_on:
      app:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    environment:
      GODEBUG: multipathtcp=0
      SAYBOARD_DOMAIN: ${SAYBOARD_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy-config:/config
volumes:
  boards:
  certificates:
  proxy-config:
